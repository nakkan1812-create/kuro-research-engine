<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>blue report</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F2430;--muted:#5F6B7A;--line:#C7D8E5;--line2:#E6EEF4;--teal:#16B8B2;--teal-d:#008E8B;--blue:#15318F;--blue2:#1E5EDB;--red:#E94A5F;--yellow:#FFD94C;--good:#00A878;--surface:#fff;--panel:#F7FBFD;--bg:#F3FBFB}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}
.header{background:linear-gradient(110deg,#1F2430 0%,#15318F 60%,#16B8B2 100%);color:#fff;padding:24px 32px;display:flex;align-items:center;gap:16px}
.header h1{font-size:22px;font-weight:900;letter-spacing:-.03em}
.header .sub{font-size:12px;color:rgba(255,255,255,.6);margin-left:auto}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px}
.container{padding:26px 0}
.card{background:var(--surface);border-radius:12px;padding:22px;margin-bottom:18px;border:1px solid var(--line2);box-shadow:0 4px 16px rgba(21,49,143,.04)}
.phase-badge{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:800;padding:4px 12px;border-radius:20px;margin-bottom:14px;letter-spacing:.04em}
.tier-section{margin-bottom:16px}
.tier-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.tier-row{display:flex;gap:8px}
.tier-btn{flex:1;padding:10px 8px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.tier-btn:hover{border-color:var(--blue2);color:var(--blue2)}
.tier-btn.active-h{border-color:#15318F;background:#EEF2FF;color:#15318F}
.tier-btn.active-m{border-color:#008E8B;background:#D9F4F3;color:#008E8B}
.tier-btn.active-l{border-color:#5F6B7A;background:#f0f0f0;color:#5F6B7A}
.tier-btn .t-name{font-size:14px;font-weight:900;display:block;margin-bottom:2px}
.tier-btn .t-models{font-size:10px;font-weight:500;line-height:1.4;display:block;opacity:.8}
.query-area,.answer-area{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:"Noto Sans JP",sans-serif;resize:vertical;background:var(--panel)}
.query-area{min-height:90px}
.answer-area{min-height:66px}
.query-area:focus,.answer-area:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(30,94,219,.1)}
.primary-btn{width:100%;padding:14px;background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;margin-top:12px;transition:opacity .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.primary-btn:hover{opacity:.9}
.primary-btn:disabled{background:#aeaeb2;cursor:default;opacity:1}
.ghost-btn{padding:10px 20px;background:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ghost-btn:hover{background:var(--panel)}
.dl-btn{padding:11px 22px;background:var(--good);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.dl-btn:hover{opacity:.9}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.q-block{margin-bottom:16px}
.q-label{font-size:14px;font-weight:700;margin-bottom:8px;color:var(--ink);display:flex;align-items:flex-start;gap:10px}
.q-label span{user-select:text;-webkit-user-select:text}
.q-num{min-width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:1px}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ai-panel{border-radius:10px;padding:16px}
.ai-claude{background:#EEF2FF;border:1px solid #c7d7ff}
.ai-gemini{background:#E6F4EA;border:1px solid #a8d5b5}
.ai-chatgpt{background:#FFF3E0;border:1px solid #f5c67a}
.ai-grok{background:#F5F5F5;border:1px solid #ccc}
.ai-label{font-size:12px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ai-claude .ai-label{color:#003ecc}
.ai-gemini .ai-label{color:#137333}
.ai-chatgpt .ai-label{color:#b45309}
.ai-grok .ai-label{color:#3a3a3c}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex-shrink:0}
.dot.run{background:var(--yellow);animation:pulse 1s infinite}
.dot.ok{background:var(--good)}
.dot.err{background:var(--red)}
.dot.skip{background:#ccc}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ai-text{font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow-y:auto;color:var(--ink)}
.ai-text.empty{color:#aaa;font-style:italic}
.status-line{font-size:11px;color:var(--teal-d);margin-top:4px;font-weight:600;min-height:16px}
.progress-bar{height:4px;background:var(--line2);border-radius:2px;margin-bottom:22px;overflow:hidden;display:none}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:2px;transition:width .5s;width:0%}
.btn-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
@keyframes spin-gear{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.gear-spin{animation:spin-gear 1.2s linear infinite;display:inline-block!important;transform-origin:center}
@media(max-width:640px){
  .ai-grid{grid-template-columns:1fr}
  .wrap{padding:0 12px}
  .tier-row{flex-direction:column}
  .primary-btn{font-size:14px;padding:13px}
  .header{padding:18px 16px}
  .header h1{font-size:17px}
  .card{padding:16px;margin-bottom:12px}
  .tier-btn{padding:10px 6px}
  .btn-row{flex-direction:column}
  .btn-row button{width:100%}
  .query-area{min-height:100px;font-size:15px}
  .answer-area{font-size:15px}
}
</style>
</head>
<body>

<div class="header" style="flex-direction:column;align-items:flex-start;gap:6px">
  <div style="display:flex;align-items:center;gap:10px">
    <h1 style="font-size:26.4px">blue report</h1>
    <span id="engineGear" style="font-size:16px;display:none;line-height:1;margin-left:4px">⚙️</span>
  </div>
  <div style="display:flex;align-items:center;gap:6px;padding-left:2px">
    <span id="jsIndicator" style="font-size:13px;line-height:1">⚫</span>
    <span class="sub" id="headerSub" style="margin-left:0">Sonnet 4.6 · Gemini 3.5 Flash · GPT-4o mini · Grok 3 mini</span>
  </div>
</div>

<div class="wrap container">

<div class="card" id="p1">
  <div class="phase-badge">PHASE 1 — テーマ入力</div>
  <div class="tier-section">
    <div class="tier-label">🎚 調査品質・モデル選択</div>
    <div class="tier-row">
      <button class="tier-btn" id="tier-h" onclick="setTier('h')">
        <span class="t-name">🔥 高</span>
        <span class="t-models">Opus 4.8 · Gemini 3.1 Pro<br>GPT-4o · Grok 3</span>
      </button>
      <button class="tier-btn active-m" id="tier-m" onclick="setTier('m')">
        <span class="t-name">⚡ 中</span>
        <span class="t-models">Sonnet 4.6 · Gemini 3.5 Flash<br>GPT-4o mini · Grok 3 mini</span>
      </button>
      <button class="tier-btn" id="tier-l" onclick="setTier('l')">
        <span class="t-name">💨 低</span>
        <span class="t-models">Haiku 4.5 · Gemini 3.5 Flash<br>GPT-4o mini · Grok 3 mini</span>
      </button>
    </div>
  </div>
  <textarea class="query-area" id="query" placeholder="調査テーマを入力してください。&#10;例：2100年、小惑星帯の希少金属採掘が商業化した場合の市場規模・主要プレイヤー・地球経済へのインパクト&#10;※具体的なほどレポート品質が上がります"></textarea>
  <div id="qError" style="color:#E94A5F;font-size:13px;margin-top:8px;padding:8px 12px;background:#fff1f2;border-radius:8px;display:none"></div>
  <button class="primary-btn" onclick="genQuestions()" id="askBtn">run now</button>
</div>

<div class="card" id="p2" style="display:none">
  <div class="phase-badge">PHASE 2 — 質問</div>
  <p style="font-size:13px;color:var(--muted);margin-bottom:16px">より精度の高い調査のために確認します。回答は全AIとウェブ検索に反映されます。</p>
  <div id="qContainer"></div>
  <button class="primary-btn" onclick="startAll()" id="startBtn" style="margin-top:20px">⬛ 4AI同時並行調査スタート</button>
</div>

<div class="progress-bar" id="pbar"><div class="progress-fill" id="pfill"></div></div>

<div class="card" id="p3" style="display:none">
  <div class="phase-badge">PHASE 3 — 4AI並行調査中</div>
  <div style="margin-top:12px"></div>
  <div class="ai-grid">
    <div class="ai-panel ai-claude">
      <div class="ai-label"><div class="dot" id="d-c"></div><span id="lbl-c">Claude Sonnet 4.6（ウェブ検索）</span></div>
      <div class="ai-text empty" id="r-c">待機中</div>
      <div class="status-line" id="s-c"></div>
    </div>
    <div class="ai-panel ai-gemini">
      <div class="ai-label"><div class="dot" id="d-g"></div><span id="lbl-g">Gemini 3.5 Flash</span></div>
      <div class="ai-text empty" id="r-g">待機中</div>
      <div class="status-line" id="s-g"></div>
    </div>
    <div class="ai-panel ai-chatgpt">
      <div class="ai-label"><div class="dot" id="d-o"></div><span id="lbl-o">GPT-4o mini</span></div>
      <div class="ai-text empty" id="r-o">待機中</div>
      <div class="status-line" id="s-o"></div>
    </div>
    <div class="ai-panel ai-grok">
      <div class="ai-label"><div class="dot" id="d-x"></div><span id="lbl-x">Grok 3 mini</span></div>
      <div class="ai-text empty" id="r-x">待機中</div>
      <div class="status-line" id="s-x"></div>
    </div>
  </div>
</div>

<div class="card" id="p4" style="display:none">
  <div class="phase-badge">PHASE 4 — 統合レポート</div>
  <div style="margin-top:12px"></div>
  <div id="synthStatus" style="font-size:13px;color:var(--muted);padding:6px 0 12px">HTMLレポートを生成中...</div>
  <iframe id="reportFrame" style="width:100%;min-height:600px;border:1px solid var(--line2);border-radius:10px;display:none" scrolling="no" onload="adjustFrame()"></iframe>
  <div id="ghSaveStatus" style="font-size:12px;color:var(--teal-d);padding:4px 0 8px;display:none"></div>
  <div class="btn-row" id="reportBtns" style="display:none;flex-direction:column;gap:10px">
    <div style="display:flex;gap:8px;align-items:stretch">
      <button id="ghOpenBtn" onclick="openGitHub()" style="background:linear-gradient(90deg,#16B8B2,#008E8B);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:default;flex:0 0 66%;padding:10px 20px;opacity:.4;touch-action:manipulation;-webkit-tap-highlight-color:transparent" disabled>🔗 GitHubで開く</button>
      <button class="ghost-btn" id="ghDelBtn" onclick="deleteFromGitHub()" style="display:none;flex:0 0 calc(30% - 4px);font-size:12px">🗑️ 削除</button>
    </div>
    <button class="dl-btn" onclick="dlReport()">📄 HTMLをダウンロード</button>
    <button class="ghost-btn" onclick="openPreview()">🔗 新しいタブで開く</button>
    <button class="ghost-btn" onclick="reset()">🔄 新しい調査</button>
  </div>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

const MODELS = {
  h: { c:'claude-opus-4-8', g:'gemini-3.1-pro-preview', o:'gpt-4o', x:'grok-3',
       lc:'Claude Opus 4.8（ウェブ検索）', lg:'Gemini 3.1 Pro', lo:'GPT-4o', lx:'Grok 3',
       head:'Opus 4.8 · Gemini 3.1 Pro · GPT-4o · Grok 3' },
  m: { c:'claude-sonnet-4-6', g:'gemini-3.5-flash', o:'gpt-4o-mini', x:'grok-3-mini',
       lc:'Claude Sonnet 4.6（ウェブ検索）', lg:'Gemini 3.5 Flash', lo:'GPT-4o mini', lx:'Grok 3 mini',
       head:'Sonnet 4.6 · Gemini 3.5 Flash · GPT-4o mini · Grok 3 mini' },
  l: { c:'claude-haiku-4-5-20251001', g:'gemini-3.5-flash', o:'gpt-4o-mini', x:'grok-3-mini',
       lc:'Claude Haiku 4.5（ウェブ検索）', lg:'Gemini 3.5 Flash', lo:'GPT-4o mini', lx:'Grok 3 mini',
       head:'Haiku 4.5 · Gemini 3.5 Flash · GPT-4o mini · Grok 3 mini' }
};
let currentTier = 'm';

function setTier(t) {
  currentTier = t;
  ['h','m','l'].forEach(x => {
    $('tier-'+x).className = 'tier-btn' + (x===t ? ' active-'+t : '');
  });
  $('headerSub').textContent = MODELS[t].head + ' · Web Search';
  updateLabels();
}

function updateLabels(){
  const m = MODELS[currentTier];
  $('lbl-c').textContent = m.lc;
  $('lbl-g').textContent = m.lg;
  $('lbl-o').textContent = m.lo;
  $('lbl-x').textContent = m.lx;
}

// バックエンドプロキシ経由でAPIを叩く（キーはブラウザに一切持たせない）
const PROXY_BASE = 'http://100.68.185.124:8787';
const PROXY_SECRET = 'f22a52ff082aa57d60f4826b8ff2e99b348db0c0960b8ba3a64b009d1c2ad370';
function proxyHeaders(extra){ return Object.assign({'X-Proxy-Secret':PROXY_SECRET}, extra||{}); }

function dot(ai,st){ $('d-'+ai).className='dot'+(st?' '+st:''); }
function res(ai,txt,err){
  const e=$('r-'+ai); e.textContent=txt; e.classList.remove('empty');
  if(err) e.style.color='#E94A5F';
}
function status(ai,txt){ $('s-'+ai).textContent=txt||''; }

async function callClaudeSearch(prompt, model, maxTok=5000, onStatus) {
  const headers = proxyHeaders({'Content-Type':'application/json'});
  const messages = [{role:'user',content:prompt}];
  for(let i=0; i<25; i++){
    const resp = await fetch(PROXY_BASE+'/api/claude',{method:'POST',headers,
      body:JSON.stringify({model,max_tokens:maxTok,tools:[{type:'web_search_20250305',name:'web_search',max_uses:10}],messages})});
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.error?.message||'Claude HTTP '+resp.status);
    const getText = c => (Array.isArray(c)?c:[c]).filter(x=>x&&x.type==='text').map(x=>x.text).join('');
    if(data.stop_reason==='end_turn') return getText(data.content);
    if(data.stop_reason==='tool_use'){
      messages.push({role:'assistant',content:data.content});
      const uses = data.content.filter(c=>c.type==='tool_use');
      if(onStatus) onStatus('🔍 検索中: '+uses.map(u=>u.input?.query).filter(Boolean).join(', '));
      messages.push({role:'user',content:uses.map(u=>({type:'tool_result',tool_use_id:u.id,content:[{type:'text',text:'Search completed.'}]}))});
      continue;
    }
    const text=getText(data.content); if(text) return text; break;
  }
  throw new Error('応答を取得できませんでした');
}

async function callClaudeDirect(prompt, model, maxTok=32000, onChunk) {
  const headers = proxyHeaders({'Content-Type':'application/json'});
  const resp = await fetch(PROXY_BASE+'/api/claude',{method:'POST',headers,
    body:JSON.stringify({model,max_tokens:maxTok,stream:true,messages:[{role:'user',content:prompt}]})});
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||'Claude HTTP '+resp.status);}
  const reader=resp.body.getReader();
  const decoder=new TextDecoder();
  let text='', truncated=false, buf='';
  while(true){
    const {done,value}=await reader.read();
    if(done) break;
    buf+=decoder.decode(value,{stream:true});
    const lines=buf.split('\n');
    buf=lines.pop();
    for(const line of lines){
      if(!line.startsWith('data:')) continue;
      const raw=line.slice(5).trim();
      if(raw==='[DONE]') break;
      try{
        const ev=JSON.parse(raw);
        if(ev.type==='content_block_delta'&&ev.delta?.type==='text_delta'){
          text+=ev.delta.text;
          if(onChunk) onChunk(text);
        }
        if(ev.type==='message_delta'&&ev.delta?.stop_reason==='max_tokens') truncated=true;
      }catch(e){}
    }
  }
  return {text,truncated};
}

async function callGemini(prompt,model){
  const r=await fetch(PROXY_BASE+'/api/gemini',
    {method:'POST',headers:proxyHeaders({'Content-Type':'application/json'}),body:JSON.stringify({model,contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:3000}})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error?.message||'Gemini '+r.status);
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'（回答なし）';
}

async function callOpenAI(prompt,model){
  const r=await fetch(PROXY_BASE+'/api/openai',
    {method:'POST',headers:proxyHeaders({'Content-Type':'application/json'}),
     body:JSON.stringify({model,max_tokens:3000,messages:[{role:'user',content:prompt}]})});
  const d=await r.json(); if(!r.ok) throw new Error(d.error?.message||'OpenAI '+r.status);
  return d.choices?.[0]?.message?.content||'（回答なし）';
}

async function callGrok(prompt,model){
  const r=await fetch(PROXY_BASE+'/api/grok',
    {method:'POST',headers:proxyHeaders({'Content-Type':'application/json'}),
     body:JSON.stringify({model,max_completion_tokens:3000,messages:[{role:'user',content:prompt}]})});
  if(r.status===403) throw new Error('Grok 403: APIキーを確認してください');
  if(r.status===429) throw new Error('Grok レート制限。しばらく後に再試行してください');
  const d=await r.json(); if(!r.ok) throw new Error(d.error?.message||'Grok '+r.status);
  return d.choices?.[0]?.message?.content||'（回答なし）';
}

function showQErr(msg){
  const e=$('qError');
  if(e){e.textContent='⚠ '+msg;e.style.display='block';setTimeout(()=>e.style.display='none',5000);}
}

async function genQuestions(){
  if(document.activeElement) document.activeElement.blur();
  const q=$('query').value.trim();
  if(!q){showQErr('調査テーマを入力してください');return;}
  const btn=$('askBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>質問を生成中...';
  setRunning(true);
  try{
    const m=MODELS[currentTier];
    const r=await callClaudeSearch(
      'あなたは総合商社のトレードビジネス・投資検討の専門アドバイザーです。\n【調査テーマ】'+q+'\n\n【重要ルール】\nあなたが調べれば分かることは質問しないこと。質問してよいのは以下のみ：\n- 調査の目的・用途（投資検討？社内勉強？競合分析？意思決定支援？）\n- 重視する観点・優先軸（コスト重視？技術難易度？地政学リスク？）\n- 依頼者が既に持っている情報・前提（除外すべき観点、すでに知っていること）\n- 比較対象や範囲の絞り込み（地域・期間・競合の絞り込み等）\n\nテーマが明確で目的が自明な場合は質問数0でよい。必要なら最大10問まで。\nJSON形式のみで返答（説明文不要）：{"questions":["質問1","質問2"]}',
      m.c,800);
    const match=r.match(/\{[\s\S]*\}/);
    if(!match){
      const c=$('qContainer'); c.innerHTML=''; c.dataset.questions='[]'; c.dataset.count='0';
      setRunning(false); btn.disabled=false; btn.innerHTML='run now';
      await startAll(); return;
    }
    let questions;
    try{ questions=JSON.parse(match[0]).questions; }catch(ex){ questions=[]; }
    if(!questions||questions.length===0){
      const c=$('qContainer'); c.innerHTML=''; c.dataset.questions='[]'; c.dataset.count='0';
      setRunning(false); btn.disabled=false; btn.innerHTML='run now';
      await startAll(); return;
    }
    const c=$('qContainer'); c.innerHTML='';
    c.dataset.questions=JSON.stringify(questions); c.dataset.count=questions.length;
    questions.forEach((q,i)=>{
      c.innerHTML+='<div class="q-block"><div class="q-label"><div class="q-num">'+(i+1)+'</div><span>'+q+'</span></div><textarea class="answer-area" id="a-'+i+'" placeholder="回答（スキップ可）"></textarea></div>';
    });
    $('p2').style.display='block';
    $('p2').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){showQErr('質問生成エラー: '+e.message);}
  setRunning(false);
  btn.disabled=false; btn.innerHTML='run now';
}

function buildPrompt(aiName,query,ctx){
  return 'あなたは'+aiName+'です。以下の調査テーマについて、徹底的かつ実務レベルの深掘り調査レポートを作成してください。\n\n【調査テーマ】\n'+query+(ctx?'\n\n【補足情報（依頼者提供）】\n'+ctx:'')+`\n\n【構成ルール】\n以下のテーマ分類に応じて最適な構成を選択してください。\n\n▼ 全テーマ共通（必須）\n1. エグゼクティブサマリー（最重要ポイント5点、数値を必ず含む）\n\n▼ 産業・投資・M&A・エネルギー・素材・インフラテーマの場合\n2. 市場・業界の定量的現状（規模・価格・成長率・直近データ）\n3. 主要プレイヤーと競合動向（具体的企業名・戦略・最近の動き）\n4. CAPEX・投資コストのベンチマーク（実際の案件名・金額・$/t）\n5. リスクと機会の定量分析（短期・中長期）\n6. 地政学・規制・マクロ環境\n7. 今後の見通しと実務的示唆\n\n▼ 技術・社会・未来・ライフスタイルテーマの場合\n2. 現状と主要トレンド（直近データ・研究動向）\n3. 主要プレイヤー・企業・組織の動向\n4. 社会・生活への影響分析\n5. リスクと機会\n6. 今後の見通しと示唆\n\n▼ 軽い・探索的・比較・ランキング系テーマの場合\n要点を絞った3〜4項目のコンパクトな構成で対応。比較・ランキング形式も積極的に活用すること。\n\n上記はガイドラインであり、テーマの性質に応じてAIの裁量で構成を調整して構いません。\n\n現時点で確認できる企業名・金額・データ・年月などは必ず記載。将来予測については、業界アナリストや公開レポートの予測値・シナリオを出典付きで引用すること。不確実性がある場合は「〜と予測される」と明示した上で記載すること。`;
}

async function startAll(){
  const q=$('query').value.trim();
  if(!q){alert('調査テーマを入力してください');return;}
  const c=$('qContainer');
  const qs=JSON.parse(c.dataset.questions||'[]');
  let ctx='';
  for(let i=0;i<parseInt(c.dataset.count||'0');i++){const a=$('a-'+i)?.value.trim();if(a)ctx+='Q: '+qs[i]+'\nA: '+a+'\n\n';}
  const m=MODELS[currentTier];
  const btn=$('startBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>4AI同時調査中...';
  setRunning(true); updateLabels();
  $('p3').style.display='block'; $('p4').style.display='none';
  $('pbar').style.display='block'; $('pfill').style.width='5%';
  $('p3').scrollIntoView({behavior:'smooth',block:'start'});
  ['c','g','o','x'].forEach(ai=>{dot(ai,'');const e=$('r-'+ai);e.textContent='待機中';e.classList.add('empty');e.style.color='';status(ai,'');});
  const results={};
  const run=async(ai,fn)=>{
    dot(ai,'run'); $('r-'+ai).textContent='調査中...'; $('r-'+ai).classList.remove('empty');
    try{const r=await fn();results[ai]=r;res(ai,r);dot(ai,'ok');status(ai,'✓ 完了');}
    catch(e){res(ai,'エラー: '+e.message,true);dot(ai,'err');status(ai,'❌ '+e.message.slice(0,40));}
  };
  status('c','Claudeが起動中...');
  const tasks=[run('c',()=>callClaudeSearch(buildPrompt(m.lc.split('（')[0],q,ctx),m.c,4000,t=>status('c',t)))];
  status('g','Geminiに送信中...');tasks.push(run('g',()=>callGemini(buildPrompt(m.lg,q,ctx),m.g)));
  status('o','ChatGPTに送信中...');tasks.push(run('o',()=>callOpenAI(buildPrompt(m.lo,q,ctx),m.o)));
  status('x','Grokに送信中...');tasks.push(run('x',()=>callGrok(buildPrompt(m.lx,q,ctx),m.x)));
  $('pfill').style.width='40%';
  await Promise.allSettled(tasks);
  $('pfill').style.width='75%';
  $('p4').style.display='block';
  $('p4').scrollIntoView({behavior:'smooth',block:'start'});
  const parts=['c','g','o','x'].filter(ai=>results[ai]).map(ai=>{const n={c:m.lc,g:m.lg,o:m.lo,x:m.lx}[ai].split('（')[0];return '【'+n+'の調査結果】\n'+results[ai];}).join('\n\n---\n\n');
  const date=new Date().toLocaleString('ja-JP');
  const cssVars='--teal:#16B8B2;--blue:#15318F;--blue2:#1E5EDB;--ink:#1F2430;--muted:#5F6B7A;--line:#C7D8E5;--good:#00A878;--mid:#F2A900;--low:#E24A4A';
  const synthPrompt='あなたは総合商社のシニアリサーチアナリストです。複数AIの調査結果を統合して、プロフェッショナルなスタンドアロンHTMLレポートを生成してください。\n\n【調査テーマ】'+q+(ctx?'\n\n【補足情報】\n'+ctx:'')+'\n\n'+parts+'\n\n【出力形式】<!DOCTYPE html>から</html>まで、完全なHTMLドキュメントのみを出力。説明文・コードブロック記号は不要。\n\n【デザイン要件】\n- <head>内に必ず: <meta name="viewport" content="width=device-width, initial-scale=1.0">\n- CSS変数: :root{'+cssVars+'}\n- ヘッダー: background:linear-gradient(110deg,#1F2430,#15318F,#16B8B2);color:#fff。ヘッダー内の全要素（h1,h2,p,span,div問わず）は必ずcolor:#fff !importantで統一。opacityやrgbaで薄くすることも禁止。背景と同系色は使わないこと\n- メトリクスカード4枚（最重要KPI。border-top:6pxで色分け）\n- データテーブル（thead濃紺背景、tbody交互色。モバイルではスクロール可能にoverflow-x:auto）\n- CSSバーチャート（実際の数値比率でwidth%を設定）\n- 信頼度バッジ: 高=緑丸、中=黄丸、低=赤丸\n- 2カラムレイアウト（リスク/機会など）\n- 試算バンド3枚（楽観/標準/保守）\n- 出典リスト（番号付き）\n- フッターに免責事項\n- 【AIコンセンサスマップ】セクションを必ず追加（レポート末尾、出典の前）：\n  🟢 全AI一致した点（3〜5項目）\n  🟡 意見が割れた点（各AIの見解を明記、2〜4項目）\n  🔴 1つのAIだけが指摘したユニーク情報（各AI1項目ずつ）\n- モバイル対応（必須）: @media(max-width:640px){body{font-size:13px} .wrap{padding:0 14px} h1{font-size:17px} h2{font-size:15px} .grid,.cards{grid-template-columns:1fr} table{font-size:11px}}\n\n【品質要件】\n- 各AIの重要情報を全て盛り込む（矛盾は論理的に整理）\n- 具体的な企業名・金額・年月を必ず記載。一般論不可\n- 出典は実際に参照した情報源を列挙\n- 生成日時: '+date+'\n- モデル: '+m.head+'\n- セクション見出しは必ず<h2>タグで記述。HTMLコメント（<!-- ... -->）はコード全体を通じて一切使用しないこと\n- レポートが途中で切れないよう、最後に必ず</body></html>で終了すること\n\n/* 冒頭に一切の前置きなし。<!DOCTYPE html>から即開始 */';
  try{
    $('synthStatus').textContent='HTMLレポートを生成中...';
    const {text:htmlOutput,truncated}=await callClaudeDirect(synthPrompt,m.c,32000,chunk=>{
      const pct=Math.min(95,Math.round(chunk.length/320));
      $('synthStatus').textContent='生成中... '+pct+'%（'+Math.round(chunk.length/1000)+'KB）';
    });
    const htmlStart=htmlOutput.search(/<!DOCTYPE html>/i);
    let cleanHtml=htmlStart>=0?htmlOutput.slice(htmlStart):htmlOutput;
    if(!/<\/html>/i.test(cleanHtml)) cleanHtml+='\n</body>\n</html>';
    window._report={query:q,ctx,results,htmlOutput:cleanHtml,tier:currentTier,date:new Date().toISOString()};
    const blob=new Blob([cleanHtml],{type:'text/html;charset=utf-8'});
    const frame=$('reportFrame');
    frame.src=URL.createObjectURL(blob);
    frame.style.display='block';
    $('synthStatus').textContent=truncated?'⚠ レポートが最大長に達しました':'✓ レポート生成完了';
    if(truncated) $('synthStatus').style.color='var(--yellow)';
    $('reportBtns').style.display='flex';
    // GitHub自動保存
    const ghStatus = $('ghSaveStatus');
    ghStatus.style.display='block';
    ghStatus.textContent='📤 GitHubに保存中...';
    try{
      const safeName = q.slice(0,30).replace(/[^a-zA-Z0-9ぁ-んァ-ン一-龥]/g,'_');
      const dateStr = new Date().toLocaleDateString('ja-JP').replace(/\//g,'');
      const filename = safeName+'_'+dateStr+'.html';
      // widgetを埋め込んでからGitHubに保存
      const widgetHtml = buildAskWidget(q, cleanHtml);
      const htmlWithWidget = cleanHtml.replace(/<\/body>/i, widgetHtml+'\n</body>');
      const ghUrl = await saveToGitHub(filename, htmlWithWidget);
      window._report.ghUrl = ghUrl;
      window._report.ghFilename = filename;
      ghStatus.textContent='✅ GitHubに保存完了';
      const openBtn = $('ghOpenBtn');
      openBtn.disabled=false; openBtn.style.opacity='1'; openBtn.style.cursor='pointer';
      $('ghDelBtn').style.display='inline-block';
      // GitHub Pages反映に少し時間がかかるため注記
      setTimeout(()=>{ ghStatus.textContent='✅ 保存完了（反映まで約1分）'; },100);
    }catch(e){
      ghStatus.textContent='⚠ GitHub保存失敗: '+e.message;
      ghStatus.style.color='var(--red)';
    }
  }catch(e){$('synthStatus').textContent='エラー: '+e.message;$('synthStatus').style.color='var(--red)';}
  $('pfill').style.width='100%';
  setTimeout(()=>$('pbar').style.display='none',1000);
  setRunning(false);
  btn.disabled=false; btn.innerHTML='⬛ 4AI同時並行調査スタート';
}

// ===== GitHub連携（プロキシ経由、PATはサーバー側で保持） =====
const GH_OWNER='nakkan1812-create',GH_REPO='kuro-research-engine',GH_BRANCH='main';
function ghProxyUrl(subPath){return PROXY_BASE+'/api/github/'+subPath;}
async function saveToGitHub(filename,html){
  const url=ghProxyUrl('repos/'+GH_OWNER+'/'+GH_REPO+'/contents/reports/'+filename);
  let sha=null;
  try{const c=await fetch(url,{headers:proxyHeaders()});if(c.ok){const d=await c.json();sha=d.sha;}}catch(e){}
  const body={message:'Add report: '+filename,content:btoa(unescape(encodeURIComponent(html))),branch:GH_BRANCH};
  if(sha)body.sha=sha;
  const resp=await fetch(url,{method:'PUT',headers:proxyHeaders({'Content-Type':'application/json'}),body:JSON.stringify(body)});
  if(!resp.ok){const e=await resp.json();throw new Error(e.message||'GitHub API error');}
  return 'https://'+GH_OWNER+'.github.io/'+GH_REPO+'/reports/'+filename;
}
async function deleteFromGitHub(){
  const r=window._report;if(!r||!r.ghFilename)return;
  if(!confirm('GitHubからこのレポートを削除しますか？'))return;
  const url=ghProxyUrl('repos/'+GH_OWNER+'/'+GH_REPO+'/contents/reports/'+r.ghFilename);
  try{
    const c=await fetch(url,{headers:proxyHeaders()});
    if(!c.ok){alert('ファイルが見つかりません');return;}
    const d=await c.json();
    const resp=await fetch(url,{method:'DELETE',headers:proxyHeaders({'Content-Type':'application/json'}),body:JSON.stringify({message:'Delete report: '+r.ghFilename,sha:d.sha,branch:GH_BRANCH})});
    if(resp.ok){$('ghDelBtn').style.display='none';$('ghOpenBtn').disabled=true;$('ghOpenBtn').style.opacity='.4';$('ghSaveStatus').textContent='🗑️ GitHubから削除しました';r.ghUrl=null;r.ghFilename=null;}
    else alert('削除に失敗しました');
  }catch(e){alert('削除エラー: '+e.message);}
}
function openGitHub(){const r=window._report;if(r&&r.ghUrl)window.open(r.ghUrl,'_blank');}

function buildAskWidget(query, synthesisText){
  const esc = s => s.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\$/g,'\\$').replace(/'/g,"\\'");
  const CSS = '<style>#askFab{position:fixed;bottom:28px;right:28px;z-index:9999;background:linear-gradient(135deg,#15318F,#16B8B2);color:#fff;border:none;padding:14px 22px;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(21,49,143,.35);touch-action:manipulation}#askOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;align-items:center;justify-content:center}#askOverlay.open{display:flex}#askBox{background:#fff;border-radius:16px;padding:28px;width:min(640px,92vw);max-height:90vh;overflow-y:auto}#askTA{width:100%;padding:12px 14px;border:1px solid #C7D8E5;border-radius:10px;font-size:15px;font-family:inherit;resize:vertical;min-height:90px;outline:none;box-sizing:border-box}#askSubmit{flex:1;padding:12px;background:#15318F;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;touch-action:manipulation}#askSubmit:disabled{background:#aaa}#askClose{padding:12px 18px;background:none;border:1px solid #C7D8E5;border-radius:10px;font-size:14px;cursor:pointer;min-height:44px;touch-action:manipulation}#askResult{display:none;margin-top:18px;padding:16px;background:#F4F7FA;border-radius:10px;border-left:5px solid #16B8B2;font-size:13.5px;line-height:1.75;white-space:pre-wrap;max-height:400px;overflow-y:auto}</style>';
  const HTML = '<button id="askFab">&#x2B1B; 追加質問・調査依頼</button><div id="askOverlay"><div id="askBox"><h3 style="font-size:18px;font-weight:800;color:#15318F;margin-bottom:6px">&#x2B1B; 追加質問・調査依頼</h3><p style="font-size:13px;color:#5F6B7A;margin-bottom:18px">このレポートを踏まえてClaudeに追加質問できます。</p><textarea id="askTA" placeholder="追加の質問・調査依頼を入力"></textarea><div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button id="askSubmit">送信して調査</button><button id="askClose">閉じる</button></div><div id="askResult"></div></div></div>';
  const q = esc(query);
  const ctx = esc(synthesisText.slice(0,4000));
  const JS = '(function(){'
    + 'var QUERY=' + JSON.stringify(q) + ';'
    + 'var CONTEXT=' + JSON.stringify(ctx) + ';'
    + 'var PROXY_BASE=' + JSON.stringify(PROXY_BASE) + ';'
    + 'var PROXY_SECRET=' + JSON.stringify(PROXY_SECRET) + ';'
    + 'async function runAsk(){'
    + '  var q2=document.getElementById("askTA").value.trim();'
    + '  if(!q2){alert("質問を入力してください");return;}'
    + '  var btn=document.getElementById("askSubmit");btn.disabled=true;btn.textContent="調査中...";'
    + '  var res=document.getElementById("askResult");res.style.display="block";res.textContent="調査中...";'
    + '  var prompt="以下の調査レポートを踏まえて追加の質問に答えてください。 / 【調査テーマ】"+QUERY+" / 【レポート概要】"+CONTEXT+" / 【追加質問】"+q2+" / 具体的な数値・企業名・出典を含めて詳しく回答してください。";'
    + '  try{'
    + '    var headers={"Content-Type":"application/json","X-Proxy-Secret":PROXY_SECRET};'
    + '    var messages=[{role:"user",content:prompt}];'
    + '    for(var i=0;i<15;i++){'
    + '      var r=await fetch(PROXY_BASE+"/api/claude",{method:"POST",headers:headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:3000,tools:[{type:"web_search_20250305",name:"web_search",max_uses:5}],messages:messages})});'
    + '      var d=await r.json();'
    + '      if(!r.ok)throw new Error(d.error&&d.error.message?d.error.message:"Error "+r.status);'
    + '      var getText=function(c){return (Array.isArray(c)?c:[c]).filter(function(x){return x&&x.type==="text";}).map(function(x){return x.text;}).join("");};'
    + '      if(d.stop_reason==="end_turn"){res.textContent=getText(d.content)||"（回答なし）";break;}'
    + '      if(d.stop_reason==="tool_use"){'
    + '        messages.push({role:"assistant",content:d.content});'
    + '        var uses=d.content.filter(function(c){return c.type==="tool_use";});'
    + '        res.textContent="検索中: "+uses.map(function(u){return u.input&&u.input.query||"";}).join(", ");'
    + '        messages.push({role:"user",content:uses.map(function(u){return {type:"tool_result",tool_use_id:u.id,content:[{type:"text",text:"Search completed."}]};})});'
    + '        continue;'
    + '      }'
    + '      res.textContent=getText(d.content)||"（回答なし）";break;'
    + '    }'
    + '  }catch(e){res.textContent="エラー: "+e.message;}'
    + '  btn.disabled=false;btn.textContent="送信して調査";'
    + '}'
    + 'function bind(id,fn){var el=document.getElementById(id);if(!el)return;el.addEventListener("click",fn);el.addEventListener("touchend",function(e){e.preventDefault();fn();},{passive:false});}'
    + 'bind("askSubmit",runAsk);'
    + 'bind("askClose",function(){document.getElementById("askOverlay").classList.remove("open");});'
    + 'bind("askFab",function(){document.getElementById("askOverlay").classList.add("open");});'
    + 'document.getElementById("askOverlay").addEventListener("click",function(e){if(e.target===this)this.classList.remove("open");});'
    + '})();';
  return CSS + HTML + '<scr'+'ipt>' + JS + '</'+'script>';
}



function dlReport(){
  const r=window._report;
  if(!r||!r.htmlOutput){alert('まず調査を完了させてね。');return;}
  const defaultName=r.query.slice(0,20).replace(/[\/\\:*?"<>|]/g,'_');
  const fname=prompt('ファイル名を入力してください（拡張子不要）',defaultName);
  if(fname===null) return;
  const widget=buildAskWidget(r.query,r.htmlOutput);
  const finalHtml=r.htmlOutput.replace(/<\/body>/i,widget+'\n</body>');
  const blob=new Blob([finalHtml],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const safeName=(fname.trim()||defaultName).replace(/[\/\\:*?"<>|]/g,'_');
  a.download='調査_'+safeName+'_'+new Date().toLocaleDateString('ja-JP').replace(/\//g,'')+'.html';
  a.click(); URL.revokeObjectURL(url);
}

function openPreview(){
  const r=window._report;
  if(!r||!r.htmlOutput){alert('まず調査を完了させてね。');return;}
  window.open(URL.createObjectURL(new Blob([r.htmlOutput],{type:'text/html;charset=utf-8'})),'_blank');
}

function adjustFrame(){

  try{const h=frame.contentDocument.documentElement.scrollHeight;frame.style.height=Math.min(Math.max(h,400),1400)+'px';}

}

function reset(){
